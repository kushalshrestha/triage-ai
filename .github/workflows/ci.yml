name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # torch is a transitive dep of sentence-transformers (see ADR-0007 /
      # backend/Dockerfile); the default PyPI Linux wheel pulls in several
      # GB of NVIDIA CUDA packages that fill the runner's disk, so install
      # the CPU build first from PyTorch's own index, same as the Dockerfile.
      - run: pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: SAST (bandit)
        run: bandit -c pyproject.toml -r app/
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt

  test:
    runs-on: ubuntu-latest
    needs: lint-and-scan
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://platform:platform@localhost:5432/support_platform
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: support_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit tests
        run: pytest tests/unit -v
      - name: Safety / red-team eval (deterministic pass-fail)
        run: pytest tests/evals/test_safety_eval.py -v
      - name: Integration tests
        run: pytest tests/integration -v

  # Eval smoke gate: runs the classification + groundedness golden-set
  # subset against a real local Ollama model on every PR (see
  # tests/evals/test_classification_eval.py, test_groundedness_eval.py).
  # Non-blocking (continue-on-error) since these are real model calls and
  # can be flaky/slow on a shared runner. tests/evals/test_retrieval_eval.py
  # and test_triage_eval.py are excluded here — they also need a live DB
  # (and, for the triage eval, a real Claude call), which this job doesn't
  # provision; run those via `docker compose exec api pytest tests/evals`.
  eval-smoke:
    runs-on: ubuntu-latest
    needs: lint-and-scan
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    env:
      OLLAMA_BASE_URL: http://localhost:11434
    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Wait for Ollama
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags && break
            sleep 2
          done
      - name: Pull eval model
        run: |
          curl -s http://localhost:11434/api/pull -d '{"name": "llama3.2:1b"}'
      - name: Eval smoke subset (real Ollama calls, no DB/Claude required)
        run: pytest tests/evals/test_classification_eval.py tests/evals/test_groundedness_eval.py -v
