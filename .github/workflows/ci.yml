name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: SAST (bandit)
        run: bandit -c pyproject.toml -r app/
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt

  test:
    runs-on: ubuntu-latest
    needs: lint-and-scan
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://platform:platform@localhost:5432/support_platform
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: support_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit tests
        run: pytest tests/unit -v
      - name: Safety / red-team eval (deterministic pass-fail)
        run: pytest tests/evals/test_safety_eval.py -v
      - name: Integration tests
        run: pytest tests/integration -v

  # Eval smoke gate: runs the small golden-set subset against real models on
  # every PR once classify_ticket() exists (see tests/evals/test_classification_eval.py).
  # Kept as a separate, non-blocking job until phase 4 lands so CI doesn't
  # fail on tests that are intentionally still skipped.
  eval-smoke:
    runs-on: ubuntu-latest
    needs: lint-and-scan
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Eval suite (non-blocking until phase 4)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pytest tests/evals -v
