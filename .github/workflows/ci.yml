name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *" # nightly full eval run, see ADR-0010
  workflow_dispatch: {}

jobs:
  lint-and-scan:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # torch is a transitive dep of sentence-transformers (see ADR-0007 /
      # backend/Dockerfile); the default PyPI Linux wheel pulls in several
      # GB of NVIDIA CUDA packages that fill the runner's disk, so install
      # the CPU build first from PyTorch's own index, same as the Dockerfile.
      - run: pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: SAST (bandit)
        run: bandit -c pyproject.toml -r app/
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt

  test:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: lint-and-scan
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://platform:platform@localhost:5432/support_platform
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: support_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit tests
        run: pytest tests/unit -v
      - name: Safety / red-team eval (deterministic pass-fail, no model call)
        run: pytest tests/evals/test_safety_eval.py -v
      - name: Integration tests
        run: pytest tests/integration -v

  # Smoke gate: every free eval (no Claude call — see ADR-0010's
  # @pytest.mark.costly split) runs blocking on every PR. Needs its own
  # Postgres (eval tests seed KB/ticket fixtures via db_session) and a
  # real Ollama with llama3.2:1b pulled.
  eval-smoke:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: lint-and-scan
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://platform:platform@localhost:5432/support_platform
      OLLAMA_BASE_URL: http://localhost:11434
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: support_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      ollama:
        image: ollama/ollama:latest
        env:
          OLLAMA_NUM_PARALLEL: "1" # see ADR-0009 — defense in depth alongside keep_alive:0
        ports:
          - 11434:11434
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Wait for Ollama and pull llama3.2:1b
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/version && break
            sleep 2
          done
          curl -X POST http://localhost:11434/api/pull -d '{"name": "llama3.2:1b"}'
      - name: Eval smoke (free evals only — classification, retrieval, groundedness)
        run: pytest tests/evals -v -m "not costly"

  # Full gate: everything, including the one eval test that calls Claude
  # for real (test_triage_eval.py). Nightly + manual only — not every PR,
  # to keep CI eval spend bounded (see ADR-0010).
  eval-full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://platform:platform@localhost:5432/support_platform
      OLLAMA_BASE_URL: http://localhost:11434
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: support_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      ollama:
        image: ollama/ollama:latest
        env:
          OLLAMA_NUM_PARALLEL: "1"
        ports:
          - 11434:11434
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Wait for Ollama and pull llama3.2:1b
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/version && break
            sleep 2
          done
          curl -X POST http://localhost:11434/api/pull -d '{"name": "llama3.2:1b"}'
      - name: Full eval suite (includes real Claude calls)
        run: pytest tests/evals -v
